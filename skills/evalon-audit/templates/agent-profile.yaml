schema_version: 2

checkout_provenance:
  checkout_root: replace-with-absolute-or-project-root-path
  revision: replace-with-inspected-revision-or-unknown
  dirty_state: unknown
  inspected_at: replace-with-ISO-8601-time

agent:
  name: replace-with-agent-name
  purpose_claim_ref: claim-agent-purpose
  entry_points: []

inspection_scope:
  included_paths: []
  limitations: []

sources:
  - id: source-primary
    # One repository-relative regular file under checkout_provenance.checkout_root; no combined paths or traversal.
    location: path/to/file.py
    # One or more current positive N or N-M ranges for that exact file.
    lines: 1-20

claims:
  - id: claim-agent-purpose
    statement: replace-with-source-grounded-statement
    source_refs: [source-primary]
    confidence: verified
    enforcement: code

input_contracts: []
output_contracts: []

instructions: []

capabilities:
  - id: capability-primary
    description: replace-with-capability
    claim_refs: [claim-agent-purpose]

tools: []
side_effects: []
state: []
external_services: []

observability:
  available: []
  gaps: []

tests_and_observed_behavior: []
unknowns: []
