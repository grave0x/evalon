[project]
name = "evalon"
version = "0.1.0"
description = "Local observability and evaluation for Python agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "textual>=5.0",
]

[project.optional-dependencies]
providers = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
]
cost = [
    "litellm>=1.91.0",
]

[project.scripts]
evalon = "evalon.tui:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
